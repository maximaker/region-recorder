<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Region Recorder settings</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1f1f1f; --muted: #5f6368; --line: #dadce0; --accent: #d93025; }
  @media (prefers-color-scheme: dark) { :root { --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --line: #3c4043; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 520px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 28px; }
  label.field { display: block; margin-bottom: 20px; }
  label.field > span { display: block; font-weight: 600; margin-bottom: 6px; }
  small { display: block; color: var(--muted); margin-top: 6px; }
  input[type=text], select { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
  .check { display: flex; gap: 10px; align-items: center; margin-bottom: 24px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { padding: 9px 16px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  button.ghost { background: transparent; color: inherit; border-color: var(--line); }
  #status { color: var(--muted); }
  code { font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Region Recorder</h1>
  <p class="lead">Click the toolbar icon (or press <code>Alt+Shift+R</code>), drag over an area, and click again to stop. The video saves by itself.</p>

  <label class="field">
    <span>Save to folder</span>
    <input id="folder" type="text" placeholder="Region Recordings">
    <small>Inside your Chrome downloads folder. Use <code>/</code> for subfolders, e.g. <code>Videos/Clips</code>. Leave empty to save in the downloads folder itself.</small>
  </label>

  <label class="field">
    <span>Video format</span>
    <select id="format">
      <option value="auto">MP4 when available (best for sharing)</option>
      <option value="webm">WebM</option>
    </select>
  </label>

  <label class="check"><input id="tabAudio" type="checkbox"> Record the tab's sound (what the page plays)</label>
  <label class="check"><input id="mic" type="checkbox"> Record my microphone</label>
  <label class="check"><input id="showClicks" type="checkbox"> Show the cursor and clicks in the video</label>

  <div class="row">
    <button id="save" type="button">Save settings</button>
    <button id="open" type="button" class="ghost">Open downloads folder</button>
    <span id="status" role="status"></span>
  </div>
</main>
<script src="options.js"></script>
</body>
</html>
